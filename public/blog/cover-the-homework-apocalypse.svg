<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#37352F"/>
      <stop offset="100%" stop-color="#3d3b35"/>
    </linearGradient>
    <linearGradient id="prism" x1="700" y1="200" x2="780" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2383E2" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#d4a574" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9065B0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.05" fill="#fff">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/>
    <circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/>
    <circle cx="700" cy="100" r="1.5"/><circle cx="800" cy="100" r="1.5"/><circle cx="900" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/>
    <circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/>
    <circle cx="700" cy="200" r="1.5"/><circle cx="800" cy="200" r="1.5"/><circle cx="900" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/>
    <circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/>
    <circle cx="700" cy="300" r="1.5"/><circle cx="800" cy="300" r="1.5"/><circle cx="900" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/>
    <circle cx="400" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/><circle cx="600" cy="400" r="1.5"/>
    <circle cx="700" cy="400" r="1.5"/><circle cx="800" cy="400" r="1.5"/><circle cx="900" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/><circle cx="300" cy="500" r="1.5"/>
    <circle cx="400" cy="500" r="1.5"/><circle cx="500" cy="500" r="1.5"/><circle cx="600" cy="500" r="1.5"/>
    <circle cx="700" cy="500" r="1.5"/><circle cx="800" cy="500" r="1.5"/><circle cx="900" cy="500" r="1.5"/>
  </g>

  <!-- Stack of old papers (left side, fading/breaking apart) -->
  <g opacity="0.18">
    <rect x="280" y="220" width="160" height="12" rx="2" fill="#e9e2ce" transform="rotate(-2 360 226)"/>
    <rect x="285" y="245" width="150" height="12" rx="2" fill="#e9e2ce" transform="rotate(1 360 251)"/>
    <rect x="282" y="270" width="155" height="12" rx="2" fill="#e9e2ce" transform="rotate(-1 360 276)"/>
    <rect x="288" y="295" width="145" height="12" rx="2" fill="#e9e2ce" transform="rotate(0.5 360 301)"/>
    <rect x="280" y="320" width="160" height="12" rx="2" fill="#e9e2ce" transform="rotate(-0.5 360 326)"/>
  </g>

  <!-- Check marks on papers (old assessment) -->
  <g stroke="#d4a574" stroke-width="1.5" opacity="0.12" stroke-linecap="round">
    <polyline points="295,225 300,230 312,218"/>
    <polyline points="298,250 303,255 315,243"/>
    <polyline points="296,275 301,280 313,268"/>
    <line x1="340" y1="226" x2="420" y2="226"/>
    <line x1="342" y1="251" x2="415" y2="251"/>
    <line x1="341" y1="276" x2="418" y2="276"/>
  </g>

  <!-- Breaking/dissolving fragments between old and new -->
  <g opacity="0.1" fill="#e9e2ce">
    <rect x="470" y="260" width="20" height="4" rx="1" transform="rotate(15 480 262)"/>
    <rect x="500" y="290" width="15" height="3" rx="1" transform="rotate(-20 507 291)"/>
    <rect x="490" y="320" width="18" height="3" rx="1" transform="rotate(30 499 321)"/>
    <rect x="520" y="250" width="12" height="3" rx="1" transform="rotate(-10 526 251)"/>
    <rect x="510" y="340" width="14" height="3" rx="1" transform="rotate(25 517 341)"/>
  </g>

  <!-- Central prism/diamond (transformation symbol) -->
  <polygon points="700,180 800,315 700,450 600,315" fill="url(#prism)" opacity="0.6"/>
  <polygon points="700,180 800,315 700,450 600,315" stroke="#d4a574" stroke-width="1" opacity="0.3" fill="none"/>

  <!-- Inner diamond lines -->
  <line x1="700" y1="180" x2="700" y2="450" stroke="#e9e2ce" stroke-width="0.5" opacity="0.15"/>
  <line x1="600" y1="315" x2="800" y2="315" stroke="#e9e2ce" stroke-width="0.5" opacity="0.15"/>

  <!-- Light rays emerging from prism (new assessment forms) -->
  <g opacity="0.2" stroke-width="1.5" stroke-linecap="round">
    <line x1="800" y1="280" x2="920" y2="220" stroke="#2383E2"/>
    <line x1="800" y1="315" x2="940" y2="315" stroke="#d4a574"/>
    <line x1="800" y1="350" x2="920" y2="410" stroke="#9065B0"/>
  </g>

  <!-- Labels at ray endpoints (abstract shapes representing new assessment) -->
  <!-- Portfolio -->
  <g opacity="0.3">
    <rect x="920" y="200" width="50" height="40" rx="6" stroke="#2383E2" stroke-width="1.5" fill="none"/>
    <rect x="926" y="210" width="38" height="3" rx="1" fill="#2383E2" opacity="0.4"/>
    <rect x="926" y="218" width="30" height="3" rx="1" fill="#2383E2" opacity="0.3"/>
    <rect x="926" y="226" width="34" height="3" rx="1" fill="#2383E2" opacity="0.2"/>
  </g>

  <!-- Formative feedback loop -->
  <g opacity="0.3">
    <circle cx="955" cy="315" r="20" stroke="#d4a574" stroke-width="1.5" fill="none"/>
    <path d="M945 305 Q955 295 965 305" stroke="#d4a574" stroke-width="1.5" fill="none"/>
    <path d="M965 325 Q955 335 945 325" stroke="#d4a574" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Process documentation -->
  <g opacity="0.3">
    <polyline points="920,395 935,410 950,400 965,415" stroke="#9065B0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="920" cy="395" r="3" fill="#9065B0"/>
    <circle cx="935" cy="410" r="3" fill="#9065B0"/>
    <circle cx="950" cy="400" r="3" fill="#9065B0"/>
    <circle cx="965" cy="415" r="3" fill="#9065B0"/>
  </g>

  <!-- Bloom's taxonomy levels faintly in background -->
  <g opacity="0.06" fill="#e9e2ce">
    <rect x="150" y="420" width="200" height="20" rx="3"/>
    <rect x="170" y="445" width="160" height="20" rx="3"/>
    <rect x="190" y="470" width="120" height="20" rx="3"/>
    <rect x="210" y="495" width="80" height="20" rx="3"/>
    <rect x="225" y="520" width="50" height="20" rx="3"/>
  </g>
</svg>
